<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifa Script Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ Title Bar ============ -->
<div class="titlebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#cccccc"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span class="titlebar-label">Cifa Script Playground</span>
</div>

<!-- ============ Main Layout ============ -->
<div class="main-layout">

    <!-- Activity Bar -->
    <div class="activity-bar">
        <div class="activity-bar-item active" id="activity-explorer" title="资源管理器">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </div>
        <div class="activity-bar-item" id="activity-settings" title="设置" style="margin-top:auto;">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.04 7.04 0 00-1.63-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.63.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.48.48 0 00.12.61l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.04.7 1.63.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>资源管理器</span>
            <div class="sidebar-actions">
                <button class="sidebar-action-btn" id="btn-new-file" title="新建文件">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 1h-7L3 4.5V14a1 1 0 001 1h9a1 1 0 001-1V2a1 1 0 00-1-1zM9 2v3h3L9 2zM4 14V5.5H3.5a.5.5 0 00-.5.5v8a.5.5 0 00.5.5H4z"/></svg>
                </button>
                <button class="sidebar-action-btn" id="btn-new-folder" title="新建文件夹">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14 4H9L7.5 2H2a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1V5a1 1 0 00-1-1z"/></svg>
                </button>
            </div>
        </div>
        <div class="sidebar-content" id="file-tree">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Sidebar Sash -->
    <div class="sash-vertical" id="sash-sidebar"></div>

    <!-- Center Area -->
    <div class="center-area">
        <!-- Toolbar -->
        <div class="toolbar">
            <button class="toolbar-btn" id="btn-run" disabled>
                <span>▶</span><span>运行</span>
            </button>
            <button class="toolbar-btn secondary" id="btn-cfg" disabled title="显示字节码程序控制流图">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                    <rect x="1.5" y="1.5" width="5" height="4" rx="1"></rect>
                    <rect x="9.5" y="10.5" width="5" height="4" rx="1"></rect>
                    <rect x="1.5" y="10.5" width="5" height="4" rx="1"></rect>
                    <path d="M6.5 3.5h3M4 5.5v5M11.5 5.5v5M6.5 12.5h3"></path>
                </svg>
                <span>程序控制流图</span>
            </button>
            <button class="toolbar-btn secondary" id="btn-clear">
                <span>清除</span>
            </button>
            <div class="toolbar-separator"></div>
            <select id="example-select" class="toolbar-select">
                <option value="">选择示例...</option>
            </select>
            <div class="toolbar-spacer"></div>
            <a href="https://github.com/whyb/cifa.js" target="_blank" class="toolbar-btn secondary" style="text-decoration:none;">
                GitHub
            </a>
        </div>

        <!-- Editor Group -->
        <div class="editor-group">
            <!-- Editor Tabs (dynamically populated by JS) -->
            <div class="editor-tabs-bar" id="editor-tabs-bar"></div>

            <!-- Editor Container -->
            <div class="editor-container">
                <div id="monaco-editor"></div>
                <div class="loading-overlay" id="loading-overlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">正在加载 Cifa 引擎...</div>
                </div>
            </div>
        </div>

        <!-- Horizontal Sash -->
        <div class="sash-horizontal" id="sash-horizontal"></div>

        <!-- Bottom Panel -->
        <div class="bottom-panel" id="bottom-panel">
            <!-- Bottom Tabs -->
            <div class="bottom-tabs-bar">
                <div class="bottom-tabs-left">
                    <div class="bottom-tab active" data-tab="output">Output</div>
                    <div class="bottom-tab" data-tab="problems">
                        Problems
                        <span class="badge" id="error-count">0</span>
                    </div>
                </div>
                <div class="bottom-tabs-right">
                    <button class="panel-action-btn" id="btn-toggle-panel" title="关闭面板">✕</button>
                </div>
            </div>

            <!-- Panel Content -->
            <div class="bottom-panel-content">
                <div class="bottom-panel-view active" id="view-output">
                    <div class="empty-state" id="output-empty">
                        <div>点击"运行"按钮执行代码</div>
                    </div>
                </div>
                <div class="bottom-panel-view" id="view-problems">
                    <div class="empty-state" id="problems-empty">
                        <div>暂无问题</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ============ Bytecode CFG Window ============ -->
<div class="cfg-overlay hidden" id="cfg-overlay">
    <div class="cfg-dialog" id="cfg-dialog" role="dialog" aria-modal="true" aria-labelledby="cfg-window-title">
        <div class="cfg-window-titlebar">
            <div class="cfg-window-title">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
                    <rect x="1.5" y="1.5" width="5" height="4" rx="1"></rect>
                    <rect x="9.5" y="10.5" width="5" height="4" rx="1"></rect>
                    <rect x="1.5" y="10.5" width="5" height="4" rx="1"></rect>
                    <path d="M6.5 3.5h3M4 5.5v5M11.5 5.5v5M6.5 12.5h3"></path>
                </svg>
                <span id="cfg-window-title">程序控制流图</span>
                <span class="cfg-window-badge">Bytecode CFG</span>
            </div>
            <div class="cfg-window-actions">
                <button type="button" class="cfg-window-action" id="cfg-maximize" title="最大化/还原">□</button>
                <button type="button" class="cfg-window-action close" id="cfg-close" title="关闭">✕</button>
            </div>
        </div>

        <div class="cfg-window-body">
            <aside class="cfg-sidebar">
                <div class="cfg-pane-heading">
                    <span>函数</span>
                    <span class="cfg-count" id="cfg-function-count">0</span>
                </div>
                <div class="cfg-function-list" id="cfg-function-list"></div>
                <div class="cfg-sidebar-section">
                    <div class="cfg-pane-heading"><span>统计</span></div>
                    <div class="cfg-stats" id="cfg-stats"></div>
                </div>
                <div class="cfg-sidebar-section cfg-legend">
                    <div class="cfg-pane-heading"><span>图例</span></div>
                    <div class="cfg-legend-row"><span class="cfg-legend-line fallthrough"></span>顺序流</div>
                    <div class="cfg-legend-row"><span class="cfg-legend-line true"></span>条件为真</div>
                    <div class="cfg-legend-row"><span class="cfg-legend-line false"></span>条件为假</div>
                    <div class="cfg-legend-row"><span class="cfg-legend-line call"></span>函数调用</div>
                    <div class="cfg-legend-row"><span class="cfg-legend-line back"></span>循环回边</div>
                </div>
            </aside>

            <section class="cfg-graph-pane">
                <div class="cfg-graph-toolbar">
                    <div class="cfg-view-tabs" role="tablist" aria-label="CFG 视图">
                        <button type="button" class="cfg-view-tab active" id="cfg-view-cfg" data-view="cfg">控制流图</button>
                        <button type="button" class="cfg-view-tab" id="cfg-view-flame" data-view="flame">火焰图</button>
                    </div>
                    <span class="cfg-toolbar-divider"></span>
                    <button type="button" class="cfg-tool-btn profile" id="cfg-profile" title="执行当前脚本并采集运行时性能数据">运行采样</button>
                    <span class="cfg-toolbar-divider"></span>
                    <button type="button" class="cfg-tool-btn" id="cfg-fit" title="适应窗口">适应</button>
                    <button type="button" class="cfg-tool-btn compact" id="cfg-zoom-out" title="缩小">−</button>
                    <span class="cfg-zoom-value" id="cfg-zoom-value">100%</span>
                    <button type="button" class="cfg-tool-btn compact" id="cfg-zoom-in" title="放大">+</button>
                    <span class="cfg-toolbar-divider"></span>
                    <label class="cfg-checkbox"><input type="checkbox" id="cfg-call-edges" checked><span>调用线</span></label>
                    <span class="cfg-toolbar-spacer"></span>
                    <span class="cfg-current-function" id="cfg-current-function"></span>
                </div>
                <div class="cfg-canvas-wrap" id="cfg-canvas-wrap">
                    <canvas id="cfg-canvas"></canvas>
                    <div class="cfg-canvas-hint">滚轮缩放 · 拖拽画布平移 · 拖拽节点调整位置 · 单击节点查看详情</div>
                </div>
            </section>

            <aside class="cfg-inspector" id="cfg-inspector">
                <div class="cfg-inspector-empty">选择节点查看详细信息</div>
            </aside>
        </div>

        <div class="cfg-window-statusbar">
            <span id="cfg-node-summary">节点 0 · 边 0</span>
            <span id="cfg-profile-summary">尚未进行性能采样</span>
            <span id="cfg-selection-summary"></span>
        </div>
    </div>
</div>

<!-- ============ Context Menus ============ -->
<div class="context-menu" id="context-menu-file">
    <div class="context-menu-item" data-action="rename">重命名</div>
    <div class="context-menu-item" data-action="delete">删除文件</div>
</div>
<div class="context-menu" id="context-menu-folder">
    <div class="context-menu-item" data-action="new-file">新建文件</div>
    <div class="context-menu-item" data-action="new-folder">新建文件夹</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="rename">重命名</div>
    <div class="context-menu-item" data-action="delete">删除文件夹</div>
</div>
<div class="context-menu" id="context-menu-tab">
    <div class="context-menu-item" data-action="close">关闭</div>
    <div class="context-menu-item" data-action="close-others">关闭其他</div>
    <div class="context-menu-item" data-action="close-all">关闭全部</div>
</div>

<!-- ============ Status Bar ============ -->
<div class="statusbar">
    <div class="statusbar-left">
        <div class="statusbar-item">
            <span class="status-dot loading" id="status-dot"></span>
            <span id="status-text">正在初始化...</span>
        </div>
    </div>
    <div class="statusbar-right">
        <div class="statusbar-item" id="status-cursor">Ln 1, Col 1</div>
        <div class="statusbar-item">UTF-8</div>
        <div class="statusbar-item">Cifa</div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
