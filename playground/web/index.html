<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifa Script Playground</title>
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
        }

        /* VS 风格工具栏 */
        .toolbar {
            height: 40px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
        }

        .toolbar-title {
            font-size: 13px;
            font-weight: 600;
            color: #cccccc;
            margin-right: 16px;
        }

        .toolbar-btn {
            padding: 4px 12px;
            background: #0e639c;
            border: none;
            border-radius: 2px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: #1177bb;
        }

        .toolbar-btn:disabled {
            background: #3e3e42;
            cursor: not-allowed;
            color: #808080;
        }

        .toolbar-btn.secondary {
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
        }

        .toolbar-btn.secondary:hover {
            background: #484848;
        }

        .toolbar-separator {
            width: 1px;
            height: 20px;
            background: #5a5a5a;
            margin: 0 8px;
        }

        .toolbar-status {
            margin-left: auto;
            font-size: 12px;
            color: #808080;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-indicator.loading {
            background: #ffc107;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 主布局 */
        .main-container {
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        /* 编辑器区域 */
        .editor-container {
            flex: 1;
            min-height: 300px;
            position: relative;
        }

        #monaco-editor {
            width: 100%;
            height: 100%;
        }

        /* 底部面板 */
        .bottom-panel {
            height: 200px;
            min-height: 100px;
            max-height: 50vh;
            background: #1e1e1e;
            border-top: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            resize: vertical;
            overflow: hidden;
        }

        /* 选项卡 */
        .panel-tabs {
            height: 32px;
            background: #2d2d30;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 2px;
        }

        .panel-tab {
            padding: 6px 16px;
            font-size: 12px;
            color: #969696;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .panel-tab:hover {
            color: #cccccc;
        }

        .panel-tab.active {
            color: #ffffff;
            border-bottom-color: #007acc;
            background: #1e1e1e;
        }

        .panel-tab .badge {
            background: #c75450;
            color: white;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
            margin-left: 6px;
        }

        /* 面板内容 */
        .panel-content {
            flex: 1;
            overflow: auto;
            display: none;
        }

        .panel-content.active {
            display: block;
        }

        /* 输出面板 */
        #output-content {
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .output-line {
            margin-bottom: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .output-success {
            color: #4caf50;
        }

        .output-error {
            color: #f48771;
        }

        .output-info {
            color: #75beff;
        }

        .output-value {
            color: #ce9178;
            font-weight: bold;
        }

        /* 错误列表表格 */
        #error-content {
            overflow: auto;
        }

        .error-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .error-table th {
            background: #2d2d30;
            color: #cccccc;
            font-weight: normal;
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #3e3e42;
            position: sticky;
            top: 0;
        }

        .error-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #252526;
            cursor: pointer;
        }

        .error-table tr:hover td {
            background: #2a2d2e;
        }

        .error-table tr.selected td {
            background: #37373d;
        }

        .error-code {
            color: #f48771;
            font-family: 'Consolas', monospace;
        }

        .error-line {
            color: #b5cea8;
            font-family: 'Consolas', monospace;
        }

        .error-file {
            color: #9cdcfe;
        }

        .error-desc {
            color: #d4d4d4;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6e6e6e;
            font-size: 13px;
        }

        /* 调整大小的手柄 */
        .resize-handle {
            height: 4px;
            background: transparent;
            cursor: ns-resize;
            position: absolute;
            top: -2px;
            left: 0;
            right: 0;
        }

        .resize-handle:hover {
            background: #007acc;
        }

        /* 加载遮罩 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 30, 30, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3e3e42;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 13px;
            color: #cccccc;
        }

        .loading-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <span class="toolbar-title">Cifa Script Playground</span>
        <button class="toolbar-btn" id="btn-run" disabled>
            <span>▶</span>
            <span>运行</span>
        </button>
        <button class="toolbar-btn secondary" id="btn-clear">
            <span>清除输出</span>
        </button>
        <div class="toolbar-separator"></div>
        <label for="example-select" style="font-size:12px;color:#cccccc;">示例:</label>
        <select id="example-select" class="toolbar-btn secondary" style="padding-right:22px;">
            <option value="">选择示例...</option>
        </select>
        <div class="toolbar-status">
            <span class="status-indicator loading" id="status-indicator"></span>
            <span id="status-text">正在初始化...</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 编辑器 -->
        <div class="editor-container">
            <div id="monaco-editor"></div>
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在加载 Cifa 引擎...</div>
            </div>
        </div>

        <!-- 底部面板 -->
        <div class="bottom-panel" id="bottom-panel">
            <!-- 选项卡 -->
            <div class="panel-tabs">
                <div class="panel-tab active" data-tab="output">
                    Output
                </div>
                <div class="panel-tab" data-tab="error">
                    Error List
                    <span class="badge" id="error-count" style="display: none;">0</span>
                </div>
            </div>

            <!-- 输出内容 -->
            <div class="panel-content active" id="output-content">
                <div class="empty-state">
                    <div>点击"运行"按钮执行代码</div>
                </div>
            </div>

            <!-- 错误列表 -->
            <div class="panel-content" id="error-content">
                <div class="empty-state">
                    <div>暂无错误</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
